<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول المسؤول | Admin Control Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/api/theme.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0b0f19;
      background-image:
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(88, 101, 242, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.5) 0px, transparent 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #f8fafc;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(88, 101, 242, 0.15);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #5865F2, #818cf8, #5865F2);
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      background: linear-gradient(135deg, rgba(88, 101, 242, 0.2), rgba(99, 102, 241, 0.05));
      border: 1px solid rgba(88, 101, 242, 0.3);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 8px 16px rgba(88, 101, 242, 0.2);
    }

    .login-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .alert-box {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 22px;
      text-align: right;
      line-height: 1.5;
      animation: fadeIn 200ms ease;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert-warning {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fcd34d;
    }

    .discord-login-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      background: #5865F2;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(88, 101, 242, 0.35);
      transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .discord-login-btn:hover {
      background: #4752c4;
      transform: translateY(-2px);
      box-shadow: 0 14px 26px rgba(88, 101, 242, 0.45);
    }

    .discord-login-btn:active {
      transform: translateY(0);
    }

    .discord-logo-svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.78rem;
      color: #64748b;
    }

    .security-badge span {
      color: #22c55e;
    }

    .back-to-store {
      display: inline-block;
      margin-top: 18px;
      color: #94a3b8;
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 150ms ease;
    }

    .back-to-store:hover {
      color: #818cf8;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="brand-icon">👑</div>
    <h1 class="login-title">لوحة تحكم المسؤول</h1>
    <p class="login-subtitle">Gaming Management Console • Discord OAuth2 Only</p>

    <!-- Dynamic Error Alert Banner -->
    <div id="errorAlert" class="alert-box alert-error">
      <div id="errorText"></div>
    </div>

    <!-- Official Discord OAuth Login Button -->
    <a href="/api/auth/discord" class="discord-login-btn" id="discordLoginBtn">
      <svg class="discord-logo-svg" viewBox="0 0 127.14 96.36">
        <path
          d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.91,96.12,53,91.08,65.69,84.69,65.69Z" />
      </svg>
      <span>تسجيل الدخول عبر Discord</span>
    </a>

    <div class="security-badge">
      <span>●</span>
      <span>مصادقة مشفرة حصرياً لحساب المسؤول المعتمد</span>
    </div>

    <div>
      <a href="/" class="back-to-store">← العودة إلى المتجر</a>
    </div>
  </div>

  <script>
    // Handle URL error messages from OAuth2 callback
    (function () {
      const params = new URLSearchParams(window.location.search);
      const error = params.get('error');
      const alertBox = document.getElementById('errorAlert');
      const errorText = document.getElementById('errorText');

      if (!error || !alertBox || !errorText) return;

      alertBox.style.display = 'block';

      switch (error) {
        case 'unauthorized':
          errorText.innerHTML = '⛔ <strong>غير مصرح:</strong> هذا الحساب في ديسكورد غير مسجل كمسؤول للنظام.<br><small style="color:#cbd5e1;">Only the authorized (ADMIN) is allowed to access</small>';
          break;
        case 'missing_config':
          alertBox.className = 'alert-box alert-warning';
          errorText.innerHTML = '⚠️ <strong>إعدادات غير مكتملة:</strong> إعدادات Discord OAuth2 غير مهيأة في متغيرات الخادم (.env).';
          break;
        case 'csrf_detected':
          errorText.innerHTML = '⚠️ <strong>فشل التحقق الأمني:</strong> انتهت صلاحية جلسة تسجيل الدخول أو حدث خطأ أمني (CSRF). يرجى المحاولة مرة أخرى.';
          break;
        case 'access_denied':
          alertBox.className = 'alert-box alert-warning';
          errorText.innerHTML = 'ℹ️ تم إلغاء تسجيل الدخول عبر Discord.';
          break;
        case 'token_exchange_failed':
        case 'fetch_user_failed':
          errorText.innerHTML = '❌ فشل الاتصال بخوادم Discord أو التحقق من الهوية. يرجى المحاولة لاحقاً.';
          break;
        case 'missing_code':
          errorText.innerHTML = '❌ لم يتم استلام رمز التحقق من Discord.';
          break;
        default:
          errorText.innerHTML = '❌ حدث خطأ أثناء محاولة تسجيل الدخول. يرجى إعادة المحاولة.';
          break;
      }
    })();
  </script>
</body>

</html>
